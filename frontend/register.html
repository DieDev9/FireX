<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - FireX Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🔥 FireX Hub</h1>
      <h2 style="text-align: center; margin-bottom: 2rem; color: #7f8c8d;">Crear Cuenta</h2>
      
      <div id="alert-container"></div>
      
      <form id="register-form">
        <div class="form-group">
          <label for="name">Nombre Completo</label>
          <input type="text" id="name" name="name" required placeholder="Juan Pérez">
        </div>
        
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" minlength="6">
        </div>
        
        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" name="phone" required placeholder="3001234567">
        </div>
        
        <div class="form-group">
          <label for="address">Dirección</label>
          <input type="text" id="address" name="address" required placeholder="Calle 123 #45-67">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Registrarse</button>
      </form>
      
      <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    const form = qs('#register-form');
    
    on(form, 'submit', async (e) => {
      e.preventDefault();
      clearAlert();
      
      const name = qs('#name').value.trim();
      const email = qs('#email').value.trim();
      const password = qs('#password').value;
      const phone = qs('#phone').value.trim();
      const address = qs('#address').value.trim();
      
      if (!name || !email || !password || !phone || !address) {
        showAlert('Por favor completa todos los campos', 'error');
        return;
      }
      
      try {
        await api('/api/users/add', {
          method: 'POST',
          body: JSON.stringify({ name, email, password, phone, address })
        });
        
        alert('¡Registro exitoso! Ahora puedes iniciar sesión.');
        location.href = 'login.html';
      } catch (error) {
        showAlert(error.message || 'Error al registrarse. Intenta nuevamente.', 'error');
      }
    });
  </script>
</body>
</html>
