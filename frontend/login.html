<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - FireX Hub</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h1>🔥 FireX Hub</h1>
      <h2 style="text-align: center; margin-bottom: 2rem; color: #7f8c8d;">Iniciar Sesión</h2>
      
      <div id="alert-container"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" name="email" required placeholder="tu@email.com">
        </div>
        
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Iniciar Sesión</button>
      </form>
      
      <div class="auth-footer">
        ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // Redirigir si ya está logueado
    if (isLoggedIn()) {
      const user = getUser();
      location.href = user.role === 'ADMIN' ? 'admin.html' : 'index.html';
    }

    const form = qs('#login-form');
    
    on(form, 'submit', async (e) => {
      e.preventDefault();
      clearAlert();
      
      const email = qs('#email').value.trim();
      const password = qs('#password').value;
      
      if (!email || !password) {
        showAlert('Por favor completa todos los campos', 'error');
        return;
      }
      
      try {
        const response = await api('/api/users/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });
        
        if (response.success && response.user) {
          setUser(response.user);
          
          // Redirigir según el rol
          if (response.user.role === 'ADMIN') {
            location.href = 'admin.html';
          } else {
            location.href = 'index.html';
          }
        } else {
          showAlert(response.message || 'Credenciales incorrectas', 'error');
        }
      } catch (error) {
        showAlert(error.message || 'Error al iniciar sesión. Verifica tus credenciales.', 'error');
      }
    });
  </script>
</body>
</html>
